
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://${MONGO_APP_USER:-codecollab_app}:${MONGO_APP_PASSWORD}@mongo:27017/codecollab?authSource=codecollab}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  mongo:
    image: mongo:6
    restart: unless-stopped
    # SEC-INFRA-01: Bind port strictly to 127.0.0.1 to avoid public host interface exposure
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=codecollab
      - MONGO_APP_USER=${MONGO_APP_USER:-codecollab_app}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD}
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # SEC-INFRA-01: Bind port strictly to 127.0.0.1 to avoid public host interface exposure
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - app-network
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # SEC-INFRA-02: Isolated Rootless Execution Daemon (M1.0 Phase B)
  # Runs Docker daemon in user-namespace rootless mode under an unprivileged user (UID 1000).
  # Communicates exclusively over the internal 'execution-network' bridge (internal: true).
  # NO ports are published to the host or public internet.
  # The public backend is on 'app-network' and has ZERO network or DNS access to this daemon.
  execution-daemon:
    profiles:
      - local-dev-execution
    image: docker:27-dind-rootless
    restart: unless-stopped
    networks:
      - execution-network
    environment:
      - DOCKER_TLS_CERTDIR=
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - seccomp=unconfined
    # Defensible outer resource boundary enforced by host Docker engine
    # Prevents untrusted jobs in nested DinD from exhausting workstation RAM or CPU
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - execution-daemon-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # SEC-INFRA-02: Isolated Standalone Execution Worker (M1.0 Phase B)
  # Consumes jobs from Redis on 'app-network' and issues container creation API calls
  # exclusively to the isolated 'execution-daemon' on 'execution-network'.
  # The host /var/run/docker.sock is NEVER mounted into this container.
  # MongoDB and application auth secrets (JWT_SECRET) are completely excluded.
  execution-worker:
    profiles:
      - local-dev-execution
    build:
      context: ..
      dockerfile: backend/Dockerfile
    command: ["node", "execution/worker/index.js"]
    restart: unless-stopped
    networks:
      - app-network
      - execution-network
    environment:
      - NODE_ENV=development
      - EXECUTION_PROFILE=local-dev-execution
      - ALLOW_UNENFORCED_CGROUPS=true
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DOCKER_HOST=tcp://execution-daemon:2375
      - CONTAINER_RUNTIME=${CONTAINER_RUNTIME:-}
    depends_on:
      redis:
        condition: service_healthy
      execution-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge
  execution-network:
    driver: bridge
    internal: true

volumes:
  mongo-data:
  redis-data:
  execution-daemon-data:
